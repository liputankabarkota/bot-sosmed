name: Auto Generate Poster Liputan KabarKota

on:
  schedule:
    # Berjalan otomatis setiap 15 menit
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      article_url:
        description: 'Opsional: tempel link artikel tertentu untuk langsung dibuat posternya'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-posters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install font Roboto Condensed & dependensi Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-roboto
          pip install --quiet pillow requests

      - name: Jalankan Generator Poster Otomatis
        env:
          BLOG_URL: https://www.liputankabarkota.com
          ARTICLE_URL: ${{ github.event.inputs.article_url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python generate_posters.py

      - name: Simpan poster baru ke repositori GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posters/ processed.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto: generate poster berita terbaru"
            git push
          else
            echo "Tidak ada artikel baru."
          fi
